<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ATS · Кандидати · Вулик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ats.css">
  <style>
    .filters{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:18px; }
    .filters .fld{ display:flex; flex-direction:column; }
    .filters label{ margin:0 0 4px; }
    .filters input, .filters select{ min-width:200px; }
    .filters .grow{ flex:1; min-width:220px; }
    #candBody tr{ cursor:pointer; }
    #candBody tr:hover td{ background:var(--hover); }
    .muted{ color:var(--muted); font-size:14px; }
    .cand-name{ font-size:16px; font-weight:600; color:var(--text); }
    .cand-src{ font-size:12px; color:var(--muted); margin-top:2px; }
    .ltag{ font-size:11px; font-weight:700; padding:2px 9px; border-radius:100px; margin-left:8px; vertical-align:middle; white-space:nowrap; }
  </style>
</head>
<body>

<div id="top"></div>

<div class="wrap">
  <div id="noAccess" class="notice" hidden>
    <h2>Немає доступу</h2>
    <p>Цей акаунт не має ролі <b>hr</b>. Зверніться до адміністратора.</p>
  </div>

  <div id="panel" hidden>
    <div class="panel__head">
      <h2>Кандидати</h2>
      <button id="newBtn" class="btn btn--primary">+ Новий кандидат</button>
    </div>

    <!-- Форма створення -->
    <div id="form" class="form-panel" hidden>
      <h3>Новий кандидат</h3>
      <div class="form-grid">
        <div class="full"><label for="f_name">Ім'я та прізвище *</label><input id="f_name" type="text" placeholder="напр. Оксана Петренко"></div>
        <div><label for="f_email">Email</label><input id="f_email" type="email" placeholder="name@example.com"></div>
        <div><label for="f_phone">Телефон</label><input id="f_phone" type="text" placeholder="+380…"></div>
        <div><label for="f_location">Локація</label><input id="f_location" type="text" placeholder="напр. Львів"></div>
        <div><label for="f_salary">Очікувана ЗП, грн</label><input id="f_salary" type="number" min="0" step="500" placeholder="напр. 25000"></div>
        <div><label for="f_facebook">Facebook</label><input id="f_facebook" type="text" placeholder="посилання на профіль"></div>
        <div><label for="f_instagram">Instagram</label><input id="f_instagram" type="text" placeholder="посилання або @нік"></div>
        <div><label for="f_position">Позиція</label><select id="f_position"><option value="">— не вказано —</option></select></div>
        <div>
          <label for="f_source">Джерело</label>
          <select id="f_source">
            <option value="direct">Прямий</option>
            <option value="agency">Агенція</option>
            <option value="referral">Рекомендація</option>
            <option value="other">Інше</option>
          </select>
        </div>
        <div class="full"><label for="f_summary">Про кандидата / коментар</label><textarea id="f_summary" placeholder="Нотатка HR, видима у профілі"></textarea></div>
      </div>
      <div class="form-actions">
        <button id="saveBtn" class="btn btn--primary">Зберегти</button>
        <button id="cancelBtn" class="btn btn--ghost">Скасувати</button>
        <span id="formMsg" class="msg" style="margin:0"></span>
      </div>
    </div>

    <!-- Фільтри -->
    <div class="filters">
      <div class="fld grow">
        <label for="q">Пошук</label>
        <input id="q" type="text" placeholder="ім'я, email або телефон">
      </div>
      <div class="fld">
        <label for="posFilter">Позиція</label>
        <select id="posFilter"><option value="">Усі позиції</option></select>
      </div>
      <div class="fld">
        <label for="srcFilter">Джерело</label>
        <select id="srcFilter">
          <option value="">Усі джерела</option>
          <option value="direct">Прямий</option>
          <option value="agency">Агенція</option>
          <option value="referral">Рекомендація</option>
          <option value="other">Інше</option>
        </select>
      </div>
      <div class="fld">
        <label for="skillFilter">Навичка</label>
        <input id="skillFilter" type="text" placeholder="напр. Figma">
      </div>
    </div>

    <table>
      <thead>
        <tr><th>Ім'я</th><th style="width:220px">Позиція</th><th style="width:240px">Контакти</th>
            <th style="width:90px;text-align:center">Заявки</th><th style="width:110px">Додано</th></tr>
      </thead>
      <tbody id="candBody"></tbody>
    </table>
    <div id="emptyMsg" class="muted" style="margin-top:14px" hidden>Кандидатів не знайдено.</div>
    <div id="listMsg" class="msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=2"></script>
<script>
let candidates = [];
let positions  = [];

const SOURCE = { direct:'Прямий', agency:'Агенція', referral:'Рекомендація', other:'Інше' };
const TAG = { employee:'Працівник', ex_employee:'Екс-працівник', blacklist:'Чорний список' };
const TAG_TINT = {
  employee:    { bg:'#e4f4ea', fg:'#1a7f37' },
  ex_employee: { bg:'#eceef1', fg:'#5b6673' },
  blacklist:   { bg:'#fde7e7', fg:'#b3261e' }
};

function initCandidates() {
  el('panel').hidden = false;
  loadRefs().then(loadCandidates);
}

async function loadRefs() {
  const { data: pos } = await sb.from('positions').select('id,name').order('sort_order').order('name');
  positions = pos || [];
  const posOpts = positions.map(function (p) { return '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>'; }).join('');
  el('f_position').innerHTML = '<option value="">— не вказано —</option>' + posOpts;
  el('posFilter').innerHTML  = '<option value="">Усі позиції</option>' + posOpts;
}

async function loadCandidates() {
  let q = sb.from('candidates')
    .select('*, positions(name), applications(count)')
    .order('created_at', { ascending: false });
  const pf = el('posFilter').value;
  const sf = el('srcFilter').value;
  const term = el('q').value.trim();
  if (pf)  q = q.eq('position_id', pf);
  if (sf)  q = q.eq('source', sf);
  if (term) q = q.or('full_name.ilike.%' + term + '%,email.ilike.%' + term + '%,phone.ilike.%' + term + '%');
  const { data, error } = await q;
  if (error) { flash(el('listMsg'), 'Помилка: ' + error.message, false); return; }
  candidates = data || [];
  renderList();
}

function renderList() {
  const sk = el('skillFilter').value.trim().toLowerCase();
  const list = sk
    ? candidates.filter(function (c) { return (c.skills || []).some(function (s) { return s.toLowerCase().indexOf(sk) > -1; }); })
    : candidates;
  el('emptyMsg').hidden = list.length > 0;
  el('candBody').innerHTML = list.map(function (c) {
    const d = new Date(c.created_at).toLocaleDateString('uk-UA');
    const posName = c.positions ? c.positions.name : '—';
    const cnt = (c.applications && c.applications[0]) ? c.applications[0].count : 0;
    const contact = [c.email, c.phone].filter(Boolean).map(escapeHtml).join('<br>') || '—';
    const tagB = (c.tag && TAG[c.tag])
      ? '<span class="ltag" style="background:' + TAG_TINT[c.tag].bg + ';color:' + TAG_TINT[c.tag].fg + '">' + TAG[c.tag] + '</span>' : '';
    return '<tr data-id="' + c.id + '">'
      + '<td><div class="cand-name">' + escapeHtml(c.full_name) + tagB + '</div><div class="cand-src">' + SOURCE[c.source] + '</div></td>'
      + '<td>' + escapeHtml(posName) + '</td>'
      + '<td style="font-size:13px">' + contact + '</td>'
      + '<td style="text-align:center">' + cnt + '</td>'
      + '<td class="ord">' + d + '</td>'
      + '</tr>';
  }).join('');
}

/* ---- Створення кандидата ---- */
function openForm() {
  el('f_name').value = ''; el('f_email').value = ''; el('f_phone').value = '';
  el('f_position').value = ''; el('f_source').value = 'direct'; el('f_summary').value = '';
  el('formMsg').textContent = '';
  el('form').hidden = false;
  el('f_name').focus();
}

async function saveCandidate() {
  const name = el('f_name').value.trim();
  if (!name) { flash(el('formMsg'), 'Вкажіть ім’я', false); return; }
  const payload = {
    full_name: name,
    email: el('f_email').value.trim() || null,
    phone: el('f_phone').value.trim() || null,
    location: el('f_location').value.trim() || null,
    expected_salary: el('f_salary').value ? Number(el('f_salary').value) : null,
    facebook: el('f_facebook').value.trim() || null,
    instagram: el('f_instagram').value.trim() || null,
    position_id: el('f_position').value ? Number(el('f_position').value) : null,
    source: el('f_source').value,
    summary: el('f_summary').value.trim() || null
  };
  const { data, error } = await sb.from('candidates').insert(payload).select('id').single();
  if (error) {
    flash(el('formMsg'), error.message.indexOf('duplicate') > -1 ? 'Кандидат із таким email вже існує' : error.message, false);
    return;
  }
  location.href = 'candidate.html?id=' + data.id;
}

document.addEventListener('DOMContentLoaded', function () {
  el('newBtn').addEventListener('click', openForm);
  el('saveBtn').addEventListener('click', saveCandidate);
  el('cancelBtn').addEventListener('click', function () { el('form').hidden = true; });

  let t;
  el('q').addEventListener('input', function () { clearTimeout(t); t = setTimeout(loadCandidates, 250); });
  el('posFilter').addEventListener('change', loadCandidates);
  el('srcFilter').addEventListener('change', loadCandidates);
  el('skillFilter').addEventListener('input', renderList);

  el('candBody').addEventListener('click', function (e) {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    location.href = 'candidate.html?id=' + tr.dataset.id;
  });

  atsGuard('candidates.html', initCandidates);
});
</script>
</body>
</html>
