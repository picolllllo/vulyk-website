<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ATS · Вхід · Вулик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ats.css">
</head>
<body>

<div id="cfgWarn" class="notice" hidden>
  <h2>Треба вписати ключ Supabase</h2>
  <p>У файлі <b>ats/app.js</b> у блоці <code>CONFIG</code> впишіть <code>SB_ANON</code> — ваш anon public key.</p>
</div>

<div id="loginView" class="login" hidden>
  <h1>ATS «Вулик»</h1>
  <p>Вхід для HR</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pass">Пароль</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <div style="margin-top:18px"><button class="btn btn--primary" type="submit" style="width:100%">Увійти</button></div>
    <div id="loginMsg" class="msg"></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=4"></script>
<script>
async function routeByRole(userId) {
  const { data: me } = await sb.from('users').select('role').eq('id', userId).maybeSingle();
  location.href = (me && me.role === 'agency') ? 'agency.html' : 'jobs.html';
}

(async function () {
  if (!SB_ANON || SB_ANON.indexOf('PASTE') === 0) { el('cfgWarn').hidden = false; return; }
  // якщо вже залогінений — за роллю
  const { data: { session } } = await sb.auth.getSession();
  if (session) { routeByRole(session.user.id); return; }
  el('loginView').hidden = false;

  el('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const m = el('loginMsg'); m.className = 'msg'; m.textContent = 'Вхід…';
    const { data, error } = await sb.auth.signInWithPassword({
      email: el('email').value.trim(), password: el('pass').value
    });
    if (error) { m.className = 'msg msg--err'; m.textContent = 'Не вдалося увійти: ' + error.message; return; }
    routeByRole(data.user.id);
  });
})();
</script>
</body>
</html>
