<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ATS · Статистика · Вулик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ats.css">
  <style>
    .stat-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; }
    .stat-head h2{ font-size:27px; margin:0 0 5px; }
    .stat-head .sub{ color:var(--muted); font-size:14px; }
    .refresh{ display:inline-flex; align-items:center; gap:8px; }
    .refresh svg{ width:15px; height:15px; }
    .refresh.spin svg{ animation:spin .8s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    .kpis{ display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:22px; }
    @media (max-width:860px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
    .kpi{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px 24px; }
    .kpi__l{ font-size:14px; color:var(--text); font-weight:700; }
    .kpi__n{ font-size:40px; font-weight:800; line-height:1.05; margin-top:12px; letter-spacing:-.02em; }
    .kpi__sub{ font-size:12px; color:var(--muted); margin-top:7px; line-height:1.35; }

    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
    @media (max-width:860px){ .grid2{ grid-template-columns:1fr; } }
    .card{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px 24px; margin-bottom:20px; }
    .card h3{ margin:0 0 18px; font-size:17px; font-weight:800; }

    .srow{ margin-bottom:17px; }
    .srow:last-child{ margin-bottom:2px; }
    .srow__top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:8px; }
    .srow__label{ font-size:15px; font-weight:600; }
    .srow__val{ font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .srow__val small{ color:var(--muted); font-weight:600; margin-left:4px; }
    .sbar{ height:8px; background:#eef0ec; border-radius:100px; overflow:hidden; }
    .sbar__fill{ height:100%; background:var(--accent); border-radius:100px; min-width:3px; transition:width .35s ease; }
    .muted{ color:var(--muted); font-size:14px; }
  </style>
</head>
<body>

<div id="top"></div>

<div class="wrap">
  <div id="noAccess" class="notice" hidden>
    <h2>Немає доступу</h2>
    <p>Цей акаунт не має ролі <b>hr</b>. Зверніться до адміністратора.</p>
  </div>

  <div id="panel" hidden>
    <div class="stat-head">
      <div>
        <h2>Статистика бази</h2>
        <div class="sub" id="updated">Завантаження…</div>
      </div>
      <button class="btn btn--primary refresh" id="refreshBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Оновити
      </button>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="grid2">
      <div class="card">
        <h3>Заповненість полів</h3>
        <div id="coverage"></div>
      </div>
      <div class="card">
        <h3>Категорії</h3>
        <div id="categories"></div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3>Джерело кандидатів</h3>
        <div id="sources"></div>
      </div>
      <div class="card">
        <h3>Теги кандидатів</h3>
        <div id="tags"></div>
      </div>
    </div>

    <div id="msg" class="msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=7"></script>
<script>
const SOURCE = { direct:'Прямий (сайт/подача)', agency:'Агенція', referral:'Рекомендація', other:'Інше (job-борди)' };
const SOURCE_ORDER = ['direct','agency','referral','other'];
const TAG = { employee:'Працівник', ex_employee:'Екс-працівник', blacklist:'Чорний список', none:'Без тегу' };
const TAG_ORDER = ['employee','ex_employee','blacklist','none'];

function initStats() { el('panel').hidden = false; load(); }

function nf(n) { return (n || 0).toLocaleString('uk-UA'); }
function pct(n, total) { return total ? (n / total * 100) : 0; }
function fmtPct(p) { return (p >= 99.95 ? '100' : p.toFixed(2)) + '%'; }

/* рядок зі смугою: лейбл ліворуч, значення + % праворуч, тонка жовта смуга під ним */
function rows(container, items, total, opts) {
  opts = opts || {};
  const max = opts.scaleTotal ? total : Math.max(1, ...items.map(function (i) { return i.n; }));
  const html = items.map(function (i) {
    const p = pct(i.n, total);
    return '<div class="srow">'
      + '<div class="srow__top">'
      +   '<span class="srow__label">' + i.label + '</span>'
      +   '<span class="srow__val">' + nf(i.n) + ' <small>(' + fmtPct(p) + ')</small></span>'
      + '</div>'
      + '<div class="sbar"><div class="sbar__fill" style="width:' + (i.n / max * 100) + '%"></div></div>'
      + '</div>';
  }).join('');
  el(container).innerHTML = html || '<div class="muted">Немає даних.</div>';
}

async function load() {
  el('refreshBtn').classList.add('spin');
  const [candR, attR] = await Promise.all([
    sb.from('candidates').select('full_name,email,phone,location,skills,expected_salary,linkedin,facebook,instagram,source,tag, positions(name)'),
    sb.from('attachments').select('candidate_id'),
    loadTags()
  ]);
  el('refreshBtn').classList.remove('spin');
  if (candR.error) { flash(el('msg'), candR.error.message, false); return; }
  const cands = candR.data || [];
  const total = cands.length;
  const withCV = {}; (attR.data || []).forEach(function (a) { withCV[a.candidate_id] = true; });

  // ── Оновлено ──
  const who = (ATS.me && (ATS.me.full_name)) || (ATS.user && ATS.user.email) || '';
  el('updated').textContent = 'Оновлено щойно · живі дані' + (who ? ' · ' + who : '');

  // ── Хелпери заповненості ──
  function filled(fn) { return cands.filter(fn).length; }
  const has = function (v) { return v !== null && v !== undefined && ('' + v).trim() !== ''; };
  const reach = filled(function (c) { return has(c.email) || has(c.phone) || has(c.linkedin) || has(c.facebook) || has(c.instagram); });
  const locSet = {}; cands.forEach(function (c) { if (has(c.location)) locSet[c.location.trim().toLowerCase()] = true; });
  const skillSum = cands.reduce(function (s, c) { return s + ((c.skills && c.skills.length) || 0); }, 0);
  const avgSkills = total ? (skillSum / total) : 0;

  // ── KPI ──
  el('kpis').innerHTML = [
    { n: nf(total), l: 'Всього кандидатів', sub: '' },
    { n: fmtPct(pct(reach, total)), l: 'З контактами', sub: 'будь-що з email / телефон / LinkedIn / Facebook / Instagram' },
    { n: nf(Object.keys(locSet).length), l: 'Локацій', sub: 'унікальних міст/локацій' },
    { n: (avgSkills >= 10 ? Math.round(avgSkills) : avgSkills.toFixed(1)), l: 'Сер. навичок / кандидата', sub: '' }
  ].map(function (k) {
    return '<div class="kpi"><div class="kpi__l">' + k.l + '</div><div class="kpi__n">' + k.n + '</div>'
      + (k.sub ? '<div class="kpi__sub">' + k.sub + '</div>' : '') + '</div>';
  }).join('');

  // ── Заповненість полів ──
  rows('coverage', [
    { label: "Ім'я",      n: filled(function (c) { return has(c.full_name); }) },
    { label: 'Email',     n: filled(function (c) { return has(c.email); }) },
    { label: 'Телефон',   n: filled(function (c) { return has(c.phone); }) },
    { label: 'Навички',   n: filled(function (c) { return c.skills && c.skills.length; }) },
    { label: 'Резюме (CV)', n: Object.keys(withCV).length },
    { label: 'Локація',   n: filled(function (c) { return has(c.location); }) },
    { label: 'Очікувана ЗП', n: filled(function (c) { return has(c.expected_salary); }) },
    { label: 'LinkedIn',  n: filled(function (c) { return has(c.linkedin); }) },
    { label: 'Facebook',  n: filled(function (c) { return has(c.facebook); }) },
    { label: 'Instagram', n: filled(function (c) { return has(c.instagram); }) }
  ], total, { scaleTotal: true });

  // ── Категорії (кандидатів за позицією) ──
  const catMap = {};
  cands.forEach(function (c) {
    const name = (c.positions && c.positions.name) ? c.positions.name : 'Без категорії';
    catMap[name] = (catMap[name] || 0) + 1;
  });
  const catItems = Object.keys(catMap).map(function (k) { return { label: escapeHtml(k), n: catMap[k] }; })
    .sort(function (a, b) { return b.n - a.n; });
  rows('categories', catItems, total, { scaleTotal: false });

  // ── Джерело кандидатів ──
  const srcMap = {}; cands.forEach(function (c) { const s = c.source || 'other'; srcMap[s] = (srcMap[s] || 0) + 1; });
  rows('sources', SOURCE_ORDER.filter(function (s) { return srcMap[s]; }).map(function (s) {
    return { label: SOURCE[s], n: srcMap[s] || 0 };
  }), total, { scaleTotal: true });

  // ── Теги ──
  const tagMap = {}; cands.forEach(function (c) { const t = c.tag || 'none'; tagMap[t] = (tagMap[t] || 0) + 1; });
  const tagOrder = (ATS.tags || []).map(function (t) { return t.slug; }).concat(['none']);
  rows('tags', tagOrder.filter(function (t) { return tagMap[t]; }).map(function (t) {
    const td = tagBySlug(t);
    return { label: td ? escapeHtml(td.name) : 'Без тегу', n: tagMap[t] || 0 };
  }), total, { scaleTotal: true });
}

document.addEventListener('DOMContentLoaded', function () {
  el('refreshBtn').addEventListener('click', load);
  atsGuard('stats.html', initStats);
});
</script>
</body>
</html>
