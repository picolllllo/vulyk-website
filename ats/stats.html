<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ATS · Аналітика · Вулик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ats.css">
  <style>
    .kpis{ display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:24px; }
    @media (max-width:720px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
    .kpi{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
    .kpi__n{ font-size:30px; font-weight:800; line-height:1; }
    .kpi__l{ font-size:13px; color:var(--muted); margin-top:6px; }
    .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
    @media (max-width:820px){ .grid2{ grid-template-columns:1fr; } }
    .box{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-bottom:20px; }
    .box h3{ margin:0 0 16px; font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    .bar-row{ display:flex; align-items:center; gap:12px; margin-bottom:11px; }
    .bar-row:last-child{ margin-bottom:0; }
    .bar-label{ width:130px; font-size:13px; font-weight:600; flex-shrink:0; }
    .bar-track{ flex:1; background:#f0f0ee; border-radius:6px; height:22px; overflow:hidden; }
    .bar-fill{ height:100%; border-radius:6px; min-width:2px; transition:width .3s; }
    .bar-val{ width:74px; text-align:right; font-weight:800; font-variant-numeric:tabular-nums; }
    .bar-val small{ color:var(--muted); font-weight:600; }
    .muted{ color:var(--muted); font-size:14px; }
    table.mini{ width:100%; border-collapse:collapse; }
    table.mini th, table.mini td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); font-size:14px; }
    table.mini th{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
    table.mini td.num{ text-align:right; font-weight:800; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>

<div id="top"></div>

<div class="wrap">
  <div id="noAccess" class="notice" hidden>
    <h2>Немає доступу</h2>
    <p>Цей акаунт не має ролі <b>hr</b>. Зверніться до адміністратора.</p>
  </div>

  <div id="panel" hidden>
    <div class="panel__head"><h2>Аналітика найму</h2></div>

    <div class="kpis" id="kpis"></div>

    <div class="box">
      <h3>Воронка заявок</h3>
      <div id="funnel"></div>
      <div id="funnelEmpty" class="muted" hidden>Заявок ще немає.</div>
    </div>

    <div class="grid2">
      <div class="box">
        <h3>Вакансії за статусом</h3>
        <div id="jobsByStatus"></div>
      </div>
      <div class="box">
        <h3>Джерела кандидатів</h3>
        <div id="bySource"></div>
      </div>
    </div>

    <div class="grid2">
      <div class="box">
        <h3>Теги кандидатів</h3>
        <div id="byTag"></div>
      </div>
      <div class="box">
        <h3>Активність агенцій</h3>
        <div id="agencyStats"></div>
      </div>
    </div>

    <div id="msg" class="msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
const STAGE_ORDER = ['new','review','interview','offer','hired','rejected'];
const STAGE = { new:'Новий', review:'Розгляд', interview:'Співбесіда', offer:'Оффер', hired:'Найнято', rejected:'Відмова' };
const STAGE_TINT = {
  new:{fg:'#5b6673'}, review:{fg:'#2563eb'}, interview:{fg:'#7c3aed'},
  offer:{fg:'#8C6006'}, hired:{fg:'#1a7f37'}, rejected:{fg:'#b3261e'}
};
const STATUS = { open:'Відкриті', paused:'Пауза', draft:'Чернетки', closed:'Закриті' };
const STATUS_COLOR = { open:'#1a7f37', paused:'#8C6006', draft:'#5b6673', closed:'#b3261e' };
const SOURCE = { direct:'Прямий', agency:'Агенція', referral:'Рекомендація', other:'Інше' };
const TAG = { employee:'Працівник', ex_employee:'Екс-працівник', blacklist:'Чорний список', none:'Без тегу' };
const TAG_COLOR = { employee:'#1a7f37', ex_employee:'#5b6673', blacklist:'#b3261e', none:'#b0b0b3' };

function initStats() { el('panel').hidden = false; load(); }

function countBy(rows, key, fallback) {
  const m = {};
  rows.forEach(function (r) { const k = r[key] || fallback; m[k] = (m[k] || 0) + 1; });
  return m;
}

function bars(container, items) {
  const max = Math.max(1, ...items.map(function (i) { return i.n; }));
  const total = items.reduce(function (s, i) { return s + i.n; }, 0);
  el(container).innerHTML = items.map(function (i) {
    const pct = total ? Math.round(i.n / total * 100) : 0;
    return '<div class="bar-row">'
      + '<div class="bar-label">' + i.label + '</div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:' + (i.n / max * 100) + '%;background:' + i.color + '"></div></div>'
      + '<div class="bar-val">' + i.n + ' <small>' + pct + '%</small></div>'
      + '</div>';
  }).join('');
}

async function load() {
  const [jobsR, candR, appsR, agR] = await Promise.all([
    sb.from('jobs').select('status'),
    sb.from('candidates').select('source,tag'),
    sb.from('applications').select('stage,agency_id'),
    sb.from('agencies').select('id,name')
  ]);
  if (jobsR.error || candR.error || appsR.error) { flash(el('msg'), (jobsR.error||candR.error||appsR.error).message, false); return; }
  const jobs = jobsR.data || [], cands = candR.data || [], apps = appsR.data || [], agencies = agR.data || [];

  const jobsByStatus = countBy(jobs, 'status', 'draft');
  const appsByStage = countBy(apps, 'stage', 'new');
  const bySource = countBy(cands, 'source', 'other');
  const byTag = countBy(cands, 'tag', 'none');

  // KPI
  el('kpis').innerHTML = [
    { n: jobsByStatus.open || 0, l: 'Відкритих вакансій' },
    { n: cands.length, l: 'Кандидатів' },
    { n: apps.length, l: 'Заявок' },
    { n: appsByStage.hired || 0, l: 'Найнято' }
  ].map(function (k) { return '<div class="kpi"><div class="kpi__n">' + k.n + '</div><div class="kpi__l">' + k.l + '</div></div>'; }).join('');

  // Воронка
  el('funnelEmpty').hidden = apps.length > 0;
  bars('funnel', STAGE_ORDER.map(function (s) {
    return { label: STAGE[s], n: appsByStage[s] || 0, color: STAGE_TINT[s].fg };
  }));

  // Вакансії за статусом
  bars('jobsByStatus', ['open','paused','draft','closed'].map(function (s) {
    return { label: STATUS[s], n: jobsByStatus[s] || 0, color: STATUS_COLOR[s] };
  }));

  // Джерела
  bars('bySource', ['direct','agency','referral','other'].map(function (s) {
    return { label: SOURCE[s], n: bySource[s] || 0, color: '#E8A820' };
  }));

  // Теги
  bars('byTag', ['employee','ex_employee','blacklist','none'].map(function (s) {
    return { label: TAG[s], n: byTag[s] || 0, color: TAG_COLOR[s] };
  }));

  // Агенції
  const agName = {}; agencies.forEach(function (a) { agName[a.id] = a.name; });
  const byAgency = {};
  apps.forEach(function (a) { if (a.agency_id) byAgency[a.agency_id] = (byAgency[a.agency_id] || 0) + 1; });
  const agRows = agencies.map(function (a) { return { name: a.name, n: byAgency[a.id] || 0 }; })
    .sort(function (x, y) { return y.n - x.n; });
  if (!agRows.length) {
    el('agencyStats').innerHTML = '<div class="muted">Агенцій ще немає.</div>';
  } else {
    el('agencyStats').innerHTML = '<table class="mini"><thead><tr><th>Агенція</th><th style="text-align:right">Подано заявок</th></tr></thead><tbody>'
      + agRows.map(function (r) { return '<tr><td>' + escapeHtml(r.name) + '</td><td class="num">' + r.n + '</td></tr>'; }).join('')
      + '</tbody></table>';
  }
}

document.addEventListener('DOMContentLoaded', function () {
  atsGuard('stats.html', initStats);
});
</script>
</body>
</html>
