<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ATS · Вакансії · Вулик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ats.css">
  <style>
    .jfilter{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
    .jpill{ font:inherit; font-weight:600; font-size:14px; padding:7px 15px; border-radius:100px;
      border:1px solid var(--line); background:#fff; color:var(--text); cursor:pointer;
      display:inline-flex; gap:7px; align-items:center; transition:background .15s, border-color .15s; }
    .jpill:hover{ background:var(--hover); }
    .jpill__n{ color:var(--muted); font-weight:700; }
    .jpill--active{ background:var(--accent); border-color:var(--accent); color:#fff; }
    .jpill--active:hover{ background:var(--accent); }
    .jpill--active .jpill__n{ color:#fff; }
    /* Картки вакансій */
    .jcards{ display:flex; flex-direction:column; gap:14px; }
    .jcard{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
      background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 22px;
      cursor:pointer; transition:box-shadow .15s, border-color .15s; }
    .jcard:hover{ box-shadow:0 6px 20px rgba(0,0,0,.06); border-color:rgba(0,0,0,.16); }
    .jcard__title{ font-size:17px; font-weight:600; color:var(--text); }
    .jcard__title .loc{ font-size:14px; font-weight:400; color:var(--muted); margin-left:10px; }
    .jcard__sub{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; font-size:13px; color:var(--muted); }
    .jcard__cands{ font-weight:600; }
    .spill{ font-size:12px; font-weight:700; padding:2px 10px; border-radius:100px; }
    .jcard__status{ flex-shrink:0; }
  </style>
</head>
<body>

<div id="top"></div>

<div class="wrap">
  <div id="noAccess" class="notice" hidden>
    <h2>Немає доступу</h2>
    <p>Цей акаунт не має ролі <b>hr</b>. Зверніться до адміністратора.</p>
  </div>

  <div id="panel" hidden>
    <div class="panel__head">
      <h2>Вакансії</h2>
      <button id="newBtn" class="btn btn--primary">+ Нова вакансія</button>
    </div>

    <!-- Форма створення / редагування -->
    <div id="form" class="form-panel" hidden>
      <h3 id="formTitle">Нова вакансія</h3>
      <div class="form-grid">
        <div class="full">
          <label for="f_title">Назва *</label>
          <input id="f_title" type="text" placeholder="напр. Лікар-педіатр">
        </div>
        <div>
          <label for="f_location">Локація</label>
          <input id="f_location" type="text" placeholder="напр. вул. Стрийська, 86В">
        </div>
        <div>
          <label for="f_employment">Зайнятість</label>
          <input id="f_employment" type="text" placeholder="напр. Повна зайнятість · 5 год/день">
        </div>
        <div>
          <label for="f_status">Статус</label>
          <select id="f_status">
            <option value="draft">Чернетка</option>
            <option value="open">Відкрита</option>
            <option value="paused">Пауза</option>
            <option value="closed">Закрита</option>
          </select>
        </div>
        <div class="full">
          <label for="f_description">Опис</label>
          <textarea id="f_description" placeholder="Обов'язки, вимоги, умови…" style="min-height:220px"></textarea>
          <div class="sub" style="margin-top:6px">Форматування: <code>## Заголовок розділу</code> · <code>- пункт списку</code> · <code>**жирний**</code>. Порожній рядок = новий абзац. Саме так опис показується на сторінці вакансії.</div>
        </div>
      </div>
      <div class="form-actions">
        <button id="saveBtn" class="btn btn--primary">Зберегти</button>
        <button id="cancelBtn" class="btn btn--ghost">Скасувати</button>
        <span id="formMsg" class="msg" style="margin:0"></span>
      </div>
    </div>

    <!-- Фільтр-пігулки -->
    <div class="jfilter" id="jfilter"></div>

    <div class="jcards" id="jobsBody"></div>
    <div id="emptyMsg" class="sub" style="margin-top:14px" hidden>Поки немає вакансій. Натисніть «Нова вакансія».</div>
    <div id="listMsg" class="msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
let jobs = [];
let appsByJob = {};      // { jobId: { total, byStage:{stage:count} } }
let activeFilter = '';
let editingId = null;   // null = режим створення

const STATUS = { draft:'Чернетка', open:'Відкрита', paused:'Пауза', closed:'Закрита' };
const STAGE = { new:'Новий', review:'Розгляд', interview:'Співбесіда', offer:'Оффер', hired:'Найнято', rejected:'Відмова' };
const STAGE_ORDER = ['new','review','interview','offer','hired','rejected'];
const STAGE_TINT = {
  new:       { bg:'#eceef1', fg:'#5b6673' },
  review:    { bg:'#e5edff', fg:'#2563eb' },
  interview: { bg:'#f0e9ff', fg:'#7c3aed' },
  offer:     { bg:'#fbedcf', fg:'#8C6006' },
  hired:     { bg:'#e4f4ea', fg:'#1a7f37' },
  rejected:  { bg:'#fde7e7', fg:'#b3261e' }
};
const FILTERS = [
  { key:'',       label:'Усі' },
  { key:'open',   label:'Відкриті' },
  { key:'paused', label:'Пауза' },
  { key:'draft',  label:'Чернетки' },
  { key:'closed', label:'Закриті' }
];

function initJobs() {
  el('panel').hidden = false;
  loadJobs();
}

async function loadJobs() {
  const [jobsRes, appsRes] = await Promise.all([
    sb.from('jobs').select('*').order('created_at', { ascending: false }),
    sb.from('applications').select('job_id,stage')
  ]);
  if (jobsRes.error) { flash(el('listMsg'), 'Помилка: ' + jobsRes.error.message); return; }
  jobs = jobsRes.data || [];
  appsByJob = {};
  (appsRes.data || []).forEach(function (a) {
    const e = appsByJob[a.job_id] || (appsByJob[a.job_id] = { total: 0, byStage: {} });
    e.total += 1;
    e.byStage[a.stage] = (e.byStage[a.stage] || 0) + 1;
  });
  renderFilter();
  render();
}

function renderFilter() {
  el('jfilter').innerHTML = FILTERS.map(function (f) {
    const n = f.key ? jobs.filter(function (j) { return j.status === f.key; }).length : jobs.length;
    const active = f.key === activeFilter ? ' jpill--active' : '';
    return '<button class="jpill' + active + '" data-f="' + f.key + '">' + f.label + ' <span class="jpill__n">' + n + '</span></button>';
  }).join('');
}

function render() {
  const list = activeFilter ? jobs.filter(function (j) { return j.status === activeFilter; }) : jobs;
  el('emptyMsg').hidden = list.length > 0;
  el('jobsBody').innerHTML = list.map(function (j) {
    const st = appsByJob[j.id] || { total: 0, byStage: {} };
    const stagePills = STAGE_ORDER.filter(function (s) { return st.byStage[s]; }).map(function (s) {
      const t = STAGE_TINT[s];
      return '<span class="spill" style="background:' + t.bg + ';color:' + t.fg + '">' + STAGE[s] + ' ' + st.byStage[s] + '</span>';
    }).join('');
    const loc = j.location ? '<span class="loc">· ' + escapeHtml(j.location) + '</span>' : '';
    const candWord = st.total === 1 ? 'кандидат' : (st.total >= 2 && st.total <= 4 ? 'кандидати' : 'кандидатів');
    return '<div class="jcard" data-id="' + j.id + '">'
      + '<div>'
      +   '<div class="jcard__title">' + escapeHtml(j.title) + loc + '</div>'
      +   '<div class="jcard__sub"><span class="jcard__cands">' + st.total + ' ' + candWord + '</span>' + stagePills + '</div>'
      + '</div>'
      + '<span class="pill pill--' + j.status + ' jcard__status">' + STATUS[j.status] + '</span>'
      + '</div>';
  }).join('');
}

function openForm(job) {
  editingId = job ? job.id : null;
  el('formTitle').textContent = job ? 'Редагувати вакансію' : 'Нова вакансія';
  el('f_title').value = job ? (job.title || '') : '';
  el('f_location').value = job ? (job.location || '') : '';
  el('f_employment').value = job ? (job.employment || '') : '';
  el('f_status').value = job ? job.status : 'draft';
  el('f_description').value = job ? (job.description || '') : '';
  el('formMsg').textContent = '';
  el('form').hidden = false;
  el('f_title').focus();
}
function closeForm() { el('form').hidden = true; editingId = null; }

async function saveJob() {
  const title = el('f_title').value.trim();
  if (!title) { flash(el('formMsg'), 'Вкажіть назву', false); return; }
  const payload = {
    title: title,
    location: el('f_location').value.trim() || null,
    employment: el('f_employment').value.trim() || null,
    status: el('f_status').value,
    description: el('f_description').value.trim() || null
  };
  let error;
  if (editingId) {
    ({ error } = await sb.from('jobs').update(payload).eq('id', editingId));
  } else {
    payload.created_by = ATS.user.id;
    ({ error } = await sb.from('jobs').insert(payload));
  }
  if (error) { flash(el('formMsg'), error.message, false); return; }
  closeForm(); loadJobs();
}

document.addEventListener('DOMContentLoaded', function () {
  el('newBtn').addEventListener('click', function () { openForm(null); });
  el('saveBtn').addEventListener('click', saveJob);
  el('cancelBtn').addEventListener('click', closeForm);

  el('jfilter').addEventListener('click', function (e) {
    const b = e.target.closest('button[data-f]'); if (!b) return;
    activeFilter = b.getAttribute('data-f');
    renderFilter(); render();
  });

  el('jobsBody').addEventListener('click', function (e) {
    const card = e.target.closest('.jcard[data-id]'); if (!card) return;
    location.href = 'job.html?id=' + card.dataset.id;
  });

  atsGuard('jobs.html', initJobs);
});
</script>
</body>
</html>
