<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ATS · Кандидат · Вулик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ats.css">
  <style>
    .back{ background:none; border:none; color:var(--muted); cursor:pointer; font:inherit; font-weight:600; padding:0; margin-bottom:14px; }
    .back:hover{ color:var(--accent-deep); }
    .chead{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:8px; }
    .cname{ font-size:24px; margin:0 0 6px; }
    .tagbadge{ font-size:12px; font-weight:700; padding:3px 12px; border-radius:100px; margin-left:12px; vertical-align:middle; white-space:nowrap; }
    .cmeta{ color:var(--muted); font-size:14px; display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
    .cmeta a{ color:var(--accent-deep); text-decoration:none; }
    .cols{ display:grid; grid-template-columns:1.4fr 1fr; gap:22px; align-items:start; }
    @media (max-width:860px){ .cols{ grid-template-columns:1fr; } }
    .box{ background:transparent; border:none; border-radius:0; padding:0; margin-bottom:26px; }
    .box h3{ margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:800; }
    .app-item{ border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
    .app-item__head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px; }
    .app-item__title{ font-weight:700; font-size:15px; }
    .app-item__title a{ color:var(--text); text-decoration:none; }
    .app-item__title a:hover{ color:var(--accent-deep); }
    .app-sub{ font-size:13px; color:var(--muted); margin-top:2px; }
    .stage-sel{ font:inherit; font-size:12px; font-weight:700; padding:4px 10px; border-radius:100px; border:1px solid; cursor:pointer; }
    .note{ border-left:3px solid var(--line); padding:5px 0 5px 12px; margin:10px 0; }
    .note__meta{ font-size:12px; color:var(--muted); margin-bottom:2px; }
    .note__text{ font-size:14px; white-space:pre-wrap; }
    .note-add{ display:flex; gap:8px; margin-top:10px; }
    .note-add textarea{ min-height:40px; }
    .att{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
    .att:last-child{ border-bottom:none; }
    .att a{ color:var(--accent-deep); text-decoration:none; font-weight:600; }
    .muted{ color:var(--muted); font-size:14px; }
    .inline-add{ display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
    .inline-add .fld{ display:flex; flex-direction:column; }
    .inline-add label{ margin:0 0 4px; }

    /* Новий макет профілю */
    .prof-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:16px; }
    .cpos{ color:var(--muted); font-size:15px; margin-top:3px; }
    .infogrid{ display:grid; grid-template-columns:repeat(5, 1fr); gap:18px; padding:18px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-bottom:16px; }
    @media (max-width:720px){ .infogrid{ grid-template-columns:repeat(2, 1fr); } }
    .info__l{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
    .info__v{ font-size:15px; margin-top:5px; }
    .contactrow{ display:flex; gap:22px; flex-wrap:wrap; align-items:center; margin-bottom:18px; font-size:14px; }
    .contactrow a{ color:var(--accent-deep); text-decoration:none; display:inline-flex; align-items:center; gap:7px; }
    .contactrow a:hover{ text-decoration:underline; }
    .prof-summary{ font-size:14px; line-height:1.65; margin:0 0 20px; white-space:pre-wrap; }
    .skills-sec{ margin-bottom:22px; }
    .skills-sec__t{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:10px; }
    .skills{ display:flex; flex-wrap:wrap; gap:8px; }
    .skill{ display:inline-flex; align-items:center; gap:8px; background:var(--head); border:1px solid var(--line); border-radius:8px; padding:5px 11px; font-size:13px; }
    .skill button{ background:none; border:none; cursor:pointer; color:var(--muted); font-weight:800; line-height:1; padding:0; }
    .skill button:hover{ color:var(--red); }
    .skill-add{ display:inline-flex; align-items:center; border:1px dashed rgba(0,0,0,.25); border-radius:8px; padding:4px 8px; }
    .skill-add input{ border:none; outline:none; font:inherit; font-size:13px; width:130px; background:transparent; padding:2px 0; }

    /* Нотатки команди */
    .tnote{ border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fcfcfb; }
    .tnote__head{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-bottom:5px; }
    .tnote__author{ font-weight:800; color:var(--text); }
    .tnote__acts{ margin-left:auto; display:flex; gap:4px; }
    .tnote__acts button{ background:none; border:none; cursor:pointer; color:var(--muted); font:inherit; font-size:12px; font-weight:700; padding:2px 6px; border-radius:6px; }
    .tnote__acts button:hover{ background:var(--hover); color:var(--accent-deep); }
    .tnote__text{ font-size:14px; white-space:pre-wrap; line-height:1.5; }
    .tnote__edited{ font-style:italic; }
    .cnote-add{ display:flex; flex-direction:column; align-items:flex-start; gap:10px; margin-top:6px; }
    .cnote-add textarea{ min-height:70px; }
    .edit-actions{ display:flex; gap:8px; margin-top:8px; }

    /* Двоколонковий макет профілю */
    .layout{ display:grid; grid-template-columns:1.7fr 1fr; gap:22px; align-items:start; }
    @media (max-width:900px){ .layout{ grid-template-columns:1fr; } }
    .side{ position:sticky; top:16px; }
    @media (max-width:900px){ .side{ position:static; } }
    .detail-row{ display:grid; grid-template-columns:160px 1fr; gap:14px; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; }
    .detail-row:last-child{ border-bottom:none; }
    .detail-row__l{ color:var(--muted); font-weight:600; }
    .detail-row__v a{ color:var(--accent-deep); text-decoration:none; }
    .detail-row__v a:hover{ text-decoration:underline; }
  </style>
</head>
<body>

<div id="top"></div>

<div class="wrap">
  <div id="noAccess" class="notice" hidden>
    <h2>Немає доступу</h2>
    <p>Цей акаунт не має ролі <b>hr</b>. Зверніться до адміністратора.</p>
  </div>

  <div id="panel" hidden>
    <button class="back" id="backBtn">← До кандидатів</button>

    <div class="prof-head">
      <div>
        <h2 class="cname" id="cName"></h2>
        <div class="cpos" id="cPos"></div>
      </div>
      <button id="editBtn" class="btn btn--ghost btn--sm">Редагувати</button>
    </div>

    <div id="notFound" class="notice" hidden><h2>Кандидата не знайдено</h2></div>

    <!-- Форма редагування профілю -->
    <div id="editPanel" class="form-panel" hidden style="margin:16px 0 22px">
      <h3>Редагувати профіль</h3>
      <div class="form-grid">
        <div class="full"><label for="e_name">Ім'я та прізвище *</label><input id="e_name" type="text"></div>
        <div><label for="e_email">Email</label><input id="e_email" type="email" placeholder="name@example.com"></div>
        <div><label for="e_phone">Телефон</label><input id="e_phone" type="text" placeholder="+380…"></div>
        <div><label for="e_location">Локація</label><input id="e_location" type="text" placeholder="напр. Львів"></div>
        <div><label for="e_experience">Досвід</label><input id="e_experience" type="text" placeholder="напр. 6 років (з 2020)"></div>
        <div><label for="e_salary">Очікувана ЗП, грн</label><input id="e_salary" type="number" min="0" step="500" placeholder="напр. 25000"></div>
        <div><label for="e_linkedin">LinkedIn</label><input id="e_linkedin" type="text" placeholder="посилання на профіль"></div>
        <div><label for="e_facebook">Facebook</label><input id="e_facebook" type="text" placeholder="посилання на профіль"></div>
        <div><label for="e_instagram">Instagram</label><input id="e_instagram" type="text" placeholder="посилання або @нік"></div>
        <div><label for="e_position">Позиція</label><select id="e_position"><option value="">— не вказано —</option></select></div>
        <div>
          <label for="e_tag">Тег кандидата</label>
          <select id="e_tag">
            <option value="">— без тегу —</option>
            <option value="employee">Працівник</option>
            <option value="ex_employee">Екс-працівник</option>
            <option value="blacklist">Чорний список</option>
          </select>
        </div>
        <div>
          <label for="e_source">Джерело</label>
          <select id="e_source">
            <option value="direct">Прямий</option>
            <option value="agency">Агенція</option>
            <option value="referral">Рекомендація</option>
            <option value="other">Інше</option>
          </select>
        </div>
        <div class="full"><label for="e_summary">Про кандидата / коментар</label><textarea id="e_summary"></textarea></div>
      </div>
      <div class="form-actions" style="justify-content:space-between; align-items:center">
        <div style="display:flex; gap:10px; align-items:center">
          <button id="e_save" class="btn btn--primary">Зберегти</button>
          <button id="e_cancel" class="btn btn--ghost">Скасувати</button>
          <span id="e_msg" class="msg" style="margin:0"></span>
        </div>
        <button id="e_delete" class="btn btn--danger">Видалити кандидата</button>
      </div>
    </div>

    <div id="content" hidden>
      <div class="layout">
        <!-- Ліва колонка -->
        <div class="main">
          <div class="box">
            <h3>Деталі</h3>
            <div id="cDetails"></div>
          </div>

          <div class="box">
            <h3>Про кандидата</h3>
            <div class="prof-summary" id="cSummary" style="margin:0"></div>
          </div>

          <div class="box">
            <h3>Навички</h3>
            <div class="skills" id="cSkills"></div>
          </div>

          <div class="box">
            <h3>Резюме та файли</h3>
            <div id="attList"></div>
            <label for="fileInput" style="margin-top:12px">Завантажити файл</label>
            <input id="fileInput" type="file" style="border:none; padding:0">
            <div id="attMsg" class="msg"></div>
          </div>

          <div class="box">
            <h3>Заявки на вакансії</h3>
            <div id="appsList"></div>
            <div class="inline-add" style="margin-top:6px">
              <div class="fld grow" style="flex:1; min-width:200px">
                <label for="a_job">Прив'язати до вакансії</label>
                <select id="a_job"><option value="">— оберіть вакансію —</option></select>
              </div>
              <div class="fld">
                <label for="a_salary">Очік. ЗП</label>
                <input id="a_salary" type="number" min="0" step="500" style="min-width:110px" placeholder="грн">
              </div>
              <button id="addAppBtn" class="btn btn--primary">Додати</button>
            </div>
            <div id="appMsg" class="msg"></div>
          </div>
        </div>

        <!-- Права колонка: нотатки -->
        <div class="side">
          <div class="box">
            <h3>Нотатки команди</h3>
            <div id="cnotesList"></div>
            <div class="cnote-add">
              <textarea id="cnoteInput" placeholder="Нотатка про кандидата…"></textarea>
              <button id="cnoteAdd" class="btn btn--primary">Додати</button>
            </div>
            <div id="cnotesMsg" class="msg"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="msg" class="msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=2"></script>
<script>
const candId = new URLSearchParams(location.search).get('id');
let current = null;
let positions = [];
let openJobs = [];
let cnotes = [];
let editingCNote = null;

const STAGE = { new:'Новий', review:'Розгляд', interview:'Співбесіда', offer:'Оффер', hired:'Найнято', rejected:'Відмова' };
const STAGE_ORDER = ['new','review','interview','offer','hired','rejected'];
const STAGE_TINT = {
  new:       { bg:'#eceef1', fg:'#5b6673' },
  review:    { bg:'#e5edff', fg:'#2563eb' },
  interview: { bg:'#f0e9ff', fg:'#7c3aed' },
  offer:     { bg:'#fbedcf', fg:'#8C6006' },
  hired:     { bg:'#e4f4ea', fg:'#1a7f37' },
  rejected:  { bg:'#fde7e7', fg:'#b3261e' }
};
const SOURCE = { direct:'Прямий', agency:'Агенція', referral:'Рекомендація', other:'Інше' };
const TAG = { employee:'Працівник', ex_employee:'Екс-працівник', blacklist:'Чорний список' };
const TAG_TINT = {
  employee:    { bg:'#e4f4ea', fg:'#1a7f37' },
  ex_employee: { bg:'#eceef1', fg:'#5b6673' },
  blacklist:   { bg:'#fde7e7', fg:'#b3261e' }
};

function normalizeUrl(v) { return /^https?:\/\//i.test(v) ? v : ('https://' + v.replace(/^@/, '')); }

function initCandidate() {
  el('panel').hidden = false;
  if (!candId) { el('notFound').hidden = false; return; }
  loadRefs().then(loadCandidate);
}

async function loadRefs() {
  const [{ data: pos }, { data: jobs }] = await Promise.all([
    sb.from('positions').select('id,name').order('sort_order').order('name'),
    sb.from('jobs').select('id,title,status').in('status', ['open','paused']).order('title')
  ]);
  positions = pos || [];
  openJobs = jobs || [];
  el('e_position').innerHTML = '<option value="">— не вказано —</option>'
    + positions.map(function (p) { return '<option value="' + p.id + '">' + escapeHtml(p.name) + '</option>'; }).join('');
  el('a_job').innerHTML = '<option value="">— оберіть вакансію —</option>'
    + openJobs.map(function (j) { return '<option value="' + j.id + '">' + escapeHtml(j.title) + '</option>'; }).join('');
}

async function loadCandidate() {
  const { data: c, error } = await sb.from('candidates').select('*, positions(name)').eq('id', candId).maybeSingle();
  if (error) { flash(el('msg'), error.message, false); return; }
  if (!c) { el('notFound').hidden = false; return; }
  current = c;

  document.title = 'ATS · ' + c.full_name + ' · Вулик';
  let tagBadge = '';
  if (c.tag && TAG[c.tag]) {
    const tt = TAG_TINT[c.tag];
    tagBadge = '<span class="tagbadge" style="background:' + tt.bg + ';color:' + tt.fg + '">' + TAG[c.tag] + '</span>';
  }
  el('cName').innerHTML = escapeHtml(c.full_name) + tagBadge;
  el('cPos').textContent = c.positions ? c.positions.name : '';

  // Деталі — усі поля вертикально (навіть порожні)
  const dash = '<span style="color:var(--muted)">—</span>';
  function link(u, label) { return '<a href="' + escapeHtml(normalizeUrl(u)) + '" target="_blank" rel="noopener">' + label + ' ↗</a>'; }
  function row(l, v) { return '<div class="detail-row"><div class="detail-row__l">' + l + '</div><div class="detail-row__v">' + v + '</div></div>'; }
  el('cDetails').innerHTML = [
    row('Локація', c.location ? escapeHtml(c.location) : dash),
    row('Досвід', c.experience ? escapeHtml(c.experience) : dash),
    row('Категорія', c.positions ? escapeHtml(c.positions.name) : dash),
    row('Очікувана ЗП', c.expected_salary ? (c.expected_salary.toLocaleString('uk-UA') + ' грн') : dash),
    row('Джерело', SOURCE[c.source]),
    row('Email', c.email ? '<a href="mailto:' + escapeHtml(c.email) + '">' + escapeHtml(c.email) + '</a>' : dash),
    row('Телефон', c.phone ? '<a href="tel:' + escapeHtml(c.phone) + '">' + escapeHtml(c.phone) + '</a>' : dash),
    row('LinkedIn', c.linkedin ? link(c.linkedin, 'Профіль') : dash),
    row('Facebook', c.facebook ? link(c.facebook, 'Профіль') : dash),
    row('Instagram', c.instagram ? link(c.instagram, 'Профіль') : dash),
    row('Додано', new Date(c.created_at).toLocaleDateString('uk-UA'))
  ].join('');

  // Про кандидата (показуємо завжди)
  if (c.summary) { el('cSummary').textContent = c.summary; }
  else { el('cSummary').innerHTML = '<span style="color:var(--muted)">Немає опису</span>'; }

  renderSkills();
  el('content').hidden = false;
  await Promise.all([loadApps(), loadAttachments(), loadCNotes()]);
}

/* ---- Навички ---- */
function renderSkills() {
  const arr = (current && current.skills) ? current.skills : [];
  el('cSkills').innerHTML = arr.map(function (s, i) {
    return '<span class="skill">' + escapeHtml(s) + '<button data-act="delskill" data-i="' + i + '" title="Прибрати">✕</button></span>';
  }).join('') + '<span class="skill-add"><input id="skillInput" type="text" placeholder="+ навичка"></span>';
}
async function saveSkills(arr) {
  const { error } = await sb.from('candidates').update({ skills: arr.length ? arr : null }).eq('id', candId);
  if (error) { flash(el('msg'), error.message, false); return; }
  current.skills = arr; renderSkills();
  const inp = el('skillInput'); if (inp) inp.focus();
}
function addSkill(val) {
  val = (val || '').trim(); if (!val) return;
  const arr = (current.skills || []).slice();
  if (arr.some(function (s) { return s.toLowerCase() === val.toLowerCase(); })) return;
  arr.push(val); saveSkills(arr);
}
function removeSkill(i) { const arr = (current.skills || []).slice(); arr.splice(i, 1); saveSkills(arr); }

/* ---- Загальні нотатки команди ---- */
async function loadCNotes() {
  const { data, error } = await sb.from('candidate_notes')
    .select('*, users(full_name,email)').eq('candidate_id', candId).order('created_at', { ascending: true });
  if (error) { el('cnotesList').innerHTML = '<div class="muted">Не вдалося завантажити нотатки: ' + escapeHtml(error.message) + '</div>'; return; }
  cnotes = data || []; renderCNotes();
}
function cnoteAuthor(n) { const u = n.users || {}; return u.full_name || u.email || 'HR'; }
function renderCNotes() {
  if (!cnotes.length) { el('cnotesList').innerHTML = '<div class="muted" style="margin-bottom:10px">Поки що немає нотаток.</div>'; return; }
  el('cnotesList').innerHTML = cnotes.map(function (n) {
    const dt = new Date(n.created_at).toLocaleString('uk-UA', { dateStyle: 'short', timeStyle: 'short' });
    const edited = (n.updated_at && n.updated_at !== n.created_at) ? ' <span class="tnote__edited">· ред.</span>' : '';
    const mine = ATS.user && n.author_id === ATS.user.id;
    if (editingCNote === n.id) {
      return '<div class="tnote" data-id="' + n.id + '">'
        + '<div class="tnote__head"><span class="tnote__author">' + escapeHtml(cnoteAuthor(n)) + '</span><span>' + dt + '</span></div>'
        + '<textarea data-role="editbox">' + escapeHtml(n.text) + '</textarea>'
        + '<div class="edit-actions"><button class="btn btn--primary btn--sm" data-act="save">Зберегти</button>'
        + '<button class="btn btn--ghost btn--sm" data-act="canceledit">Скасувати</button></div></div>';
    }
    const acts = mine
      ? '<span class="tnote__acts"><button data-act="edit">Редагувати</button><button data-act="del">Видалити</button></span>' : '';
    return '<div class="tnote" data-id="' + n.id + '">'
      + '<div class="tnote__head"><span class="tnote__author">' + escapeHtml(cnoteAuthor(n)) + '</span><span>' + dt + edited + '</span>' + acts + '</div>'
      + '<div class="tnote__text">' + escapeHtml(n.text) + '</div></div>';
  }).join('');
}
async function addCNote() {
  const text = el('cnoteInput').value.trim(); if (!text) return;
  const { error } = await sb.from('candidate_notes').insert({ candidate_id: candId, author_id: ATS.user.id, text: text });
  if (error) { flash(el('cnotesMsg'), error.message, false); return; }
  el('cnoteInput').value = ''; loadCNotes();
}

/* ---- Заявки + нотатки ---- */
async function loadApps() {
  const { data: apps, error } = await sb.from('applications')
    .select('*, jobs(title)').eq('candidate_id', candId).order('created_at', { ascending: false });
  if (error) { el('appsList').innerHTML = '<div class="muted">' + escapeHtml(error.message) + '</div>'; return; }
  const { data: notes } = await sb.from('notes')
    .select('*').eq('candidate_id', candId).order('created_at', { ascending: true });
  const byApp = {};
  (notes || []).forEach(function (n) { (byApp[n.application_id] = byApp[n.application_id] || []).push(n); });

  if (!apps || !apps.length) {
    el('appsList').innerHTML = '<div class="muted">Заявок ще немає. Прив’яжіть кандидата до вакансії нижче.</div>';
    return;
  }
  el('appsList').innerHTML = apps.map(function (a) {
    const t = STAGE_TINT[a.stage] || STAGE_TINT.new;
    const jobTitle = a.jobs ? a.jobs.title : '(вакансію видалено)';
    const jobLink = a.job_id ? '<a href="job.html?id=' + a.job_id + '">' + escapeHtml(jobTitle) + '</a>' : escapeHtml(jobTitle);
    const stageOpts = STAGE_ORDER.map(function (s) {
      return '<option value="' + s + '"' + (s === a.stage ? ' selected' : '') + '>' + STAGE[s] + '</option>';
    }).join('');
    const salary = a.salary_expectation ? (a.salary_expectation.toLocaleString('uk-UA') + ' ' + a.salary_currency) : '—';
    const notesHtml = (byApp[a.id] || []).map(function (n) {
      const nd = new Date(n.created_at).toLocaleString('uk-UA', { dateStyle:'short', timeStyle:'short' });
      return '<div class="note"><div class="note__meta">' + nd + '</div><div class="note__text">' + escapeHtml(n.text) + '</div></div>';
    }).join('');
    return '<div class="app-item" data-app="' + a.id + '">'
      + '<div class="app-item__head">'
      +   '<div><div class="app-item__title">' + jobLink + '</div>'
      +       '<div class="app-sub">Очік. ЗП: ' + salary + '</div></div>'
      +   '<select data-role="stage" class="stage-sel" style="background:' + t.bg + ';color:' + t.fg + ';border-color:' + t.bg + '">' + stageOpts + '</select>'
      + '</div>'
      + notesHtml
      + '<div class="note-add">'
      +   '<textarea data-role="note" placeholder="Додати нотатку…"></textarea>'
      +   '<button class="btn btn--ghost btn--sm" data-act="addnote">Додати</button>'
      + '</div>'
      + '</div>';
  }).join('');
}

async function addApplication() {
  const jobId = el('a_job').value;
  if (!jobId) { flash(el('appMsg'), 'Оберіть вакансію', false); return; }
  const sal = el('a_salary').value ? Number(el('a_salary').value) : null;
  const { error } = await sb.from('applications').insert({
    job_id: jobId, candidate_id: candId, stage: 'new', salary_expectation: sal
  });
  if (error) {
    flash(el('appMsg'), (error.message.indexOf('duplicate') > -1 || error.message.indexOf('unique') > -1)
      ? 'Кандидат уже має заявку на цю вакансію' : error.message, false);
    return;
  }
  el('a_job').value = ''; el('a_salary').value = '';
  flash(el('appMsg'), 'Заявку додано', true);
  loadApps();
}

/* ---- Резюме ---- */
async function loadAttachments() {
  const { data, error } = await sb.from('attachments').select('*').eq('candidate_id', candId).order('created_at', { ascending: false });
  if (error) { el('attList').innerHTML = '<div class="muted">' + escapeHtml(error.message) + '</div>'; return; }
  if (!data || !data.length) { el('attList').innerHTML = '<div class="muted">Файлів ще немає.</div>'; return; }
  el('attList').innerHTML = data.map(function (f) {
    const nm = f.file_name || 'файл';
    return '<div class="att" data-att="' + f.id + '" data-url="' + escapeHtml(f.file_url) + '" data-name="' + escapeHtml(nm) + '">'
      + '<a href="#" data-act="view" title="Відкрити у браузері">' + escapeHtml(nm) + '</a>'
      + '<span style="display:flex;gap:6px">'
      +   '<button class="btn btn--ghost btn--sm" data-act="view">Переглянути</button>'
      +   '<button class="btn btn--danger btn--sm" data-act="delfile">✕</button>'
      + '</span>'
      + '</div>';
  }).join('');
}

async function uploadFile(file) {
  if (!file) return;
  flash(el('attMsg'), 'Завантаження…', true);
  const safe = file.name.replace(/[^\w.\-]+/g, '_');
  const path = candId + '/' + Date.now() + '_' + safe;
  const up = await sb.storage.from('resumes').upload(path, file, { upsert: false });
  if (up.error) { flash(el('attMsg'), up.error.message, false); return; }
  const { error } = await sb.from('attachments').insert({
    candidate_id: candId, kind: 'resume', file_url: path, file_name: file.name, uploaded_by: ATS.user.id
  });
  if (error) { flash(el('attMsg'), error.message, false); return; }
  el('fileInput').value = '';
  flash(el('attMsg'), 'Завантажено', true);
  loadAttachments();
}

async function viewFile(path, name) {
  const w = window.open('', '_blank');   // відкриваємо одразу, щоб не блокував popup-фільтр
  const { data, error } = await sb.storage.from('resumes').createSignedUrl(path, 600, { download: false });
  if (error) { if (w) w.close(); flash(el('attMsg'), error.message, false); return; }
  const ext = (name || path).split('.').pop().toLowerCase();
  let target = data.signedUrl;
  // Word/Excel/PowerPoint — через онлайн-перегляд Microsoft Office (браузер їх сам не показує)
  if (['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'].indexOf(ext) > -1) {
    target = 'https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(data.signedUrl);
  }
  if (w) w.location = target; else window.open(target, '_blank');
}

async function deleteFile(attId, path) {
  if (!confirm('Видалити файл?')) return;
  await sb.storage.from('resumes').remove([path]);
  const { error } = await sb.from('attachments').delete().eq('id', attId);
  flash(el('attMsg'), error ? error.message : 'Видалено', !error);
  loadAttachments();
}

/* ---- Редагування / видалення профілю ---- */
function openEdit() {
  if (!current) return;
  el('e_name').value = current.full_name || '';
  el('e_email').value = current.email || '';
  el('e_phone').value = current.phone || '';
  el('e_location').value = current.location || '';
  el('e_experience').value = current.experience || '';
  el('e_salary').value = current.expected_salary || '';
  el('e_linkedin').value = current.linkedin || '';
  el('e_facebook').value = current.facebook || '';
  el('e_instagram').value = current.instagram || '';
  el('e_position').value = current.position_id ? String(current.position_id) : '';
  el('e_tag').value = current.tag || '';
  el('e_source').value = current.source;
  el('e_summary').value = current.summary || '';
  el('e_msg').textContent = '';
  el('editPanel').hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  el('e_name').focus();
}

async function saveEdit() {
  const name = el('e_name').value.trim();
  if (!name) { flash(el('e_msg'), 'Вкажіть ім’я', false); return; }
  const payload = {
    full_name: name,
    email: el('e_email').value.trim() || null,
    phone: el('e_phone').value.trim() || null,
    location: el('e_location').value.trim() || null,
    experience: el('e_experience').value.trim() || null,
    expected_salary: el('e_salary').value ? Number(el('e_salary').value) : null,
    linkedin: el('e_linkedin').value.trim() || null,
    facebook: el('e_facebook').value.trim() || null,
    instagram: el('e_instagram').value.trim() || null,
    position_id: el('e_position').value ? Number(el('e_position').value) : null,
    tag: el('e_tag').value || null,
    source: el('e_source').value,
    summary: el('e_summary').value.trim() || null
  };
  const { error } = await sb.from('candidates').update(payload).eq('id', candId);
  if (error) {
    flash(el('e_msg'), error.message.indexOf('duplicate') > -1 ? 'Кандидат із таким email вже існує' : error.message, false);
    return;
  }
  el('editPanel').hidden = true;
  loadCandidate();
}

async function deleteCandidate() {
  if (!confirm('Видалити кандидата «' + (current ? current.full_name : '') + '»?\n\nРазом з ним видаляться його заявки, нотатки та файли. Дію не можна скасувати.')) return;
  const { error } = await sb.from('candidates').delete().eq('id', candId);
  if (error) { flash(el('e_msg'), error.message, false); return; }
  location.href = 'candidates.html';
}

document.addEventListener('DOMContentLoaded', function () {
  el('backBtn').addEventListener('click', function () { location.href = 'candidates.html'; });
  el('editBtn').addEventListener('click', openEdit);
  el('e_cancel').addEventListener('click', function () { el('editPanel').hidden = true; });
  el('e_save').addEventListener('click', saveEdit);
  el('e_delete').addEventListener('click', deleteCandidate);
  el('addAppBtn').addEventListener('click', addApplication);

  el('cSkills').addEventListener('click', function (e) {
    const b = e.target.closest('button[data-act="delskill"]'); if (!b) return;
    removeSkill(Number(b.dataset.i));
  });
  el('cSkills').addEventListener('keydown', function (e) {
    if (e.target.id === 'skillInput' && e.key === 'Enter') { e.preventDefault(); addSkill(e.target.value); e.target.value = ''; }
  });

  el('cnoteAdd').addEventListener('click', addCNote);
  el('cnotesList').addEventListener('click', async function (e) {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const wrap = e.target.closest('.tnote'); const id = wrap.getAttribute('data-id');
    const act = btn.getAttribute('data-act');
    if (act === 'edit') { editingCNote = id; renderCNotes(); }
    else if (act === 'canceledit') { editingCNote = null; renderCNotes(); }
    else if (act === 'save') {
      const val = wrap.querySelector('textarea[data-role="editbox"]').value.trim(); if (!val) return;
      const { error } = await sb.from('candidate_notes').update({ text: val }).eq('id', id);
      if (error) { flash(el('cnotesMsg'), error.message, false); return; }
      editingCNote = null; loadCNotes();
    } else if (act === 'del') {
      if (!confirm('Видалити нотатку?')) return;
      const { error } = await sb.from('candidate_notes').delete().eq('id', id);
      if (error) { flash(el('cnotesMsg'), error.message, false); return; }
      loadCNotes();
    }
  });

  el('appsList').addEventListener('change', async function (e) {
    const sel = e.target.closest('select[data-role="stage"]'); if (!sel) return;
    const appId = e.target.closest('.app-item').dataset.app;
    const { error } = await sb.from('applications').update({ stage: sel.value }).eq('id', appId);
    if (error) { flash(el('appMsg'), error.message, false); return; }
    flash(el('appMsg'), 'Етап оновлено', true);
    loadApps();
  });
  el('appsList').addEventListener('click', async function (e) {
    const btn = e.target.closest('button[data-act="addnote"]'); if (!btn) return;
    const item = e.target.closest('.app-item');
    const ta = item.querySelector('textarea[data-role="note"]');
    const text = ta.value.trim(); if (!text) return;
    const { error } = await sb.from('notes').insert({
      application_id: item.dataset.app, candidate_id: candId, author_id: ATS.user.id, text: text
    });
    if (error) { flash(el('appMsg'), error.message, false); return; }
    ta.value = '';
    loadApps();
  });

  el('fileInput').addEventListener('change', function (e) { uploadFile(e.target.files[0]); });
  el('attList').addEventListener('click', function (e) {
    const a = e.target.closest('[data-act]'); if (!a) return;
    e.preventDefault();
    const row = e.target.closest('.att');
    if (a.dataset.act === 'view') viewFile(row.dataset.url, row.dataset.name);
    else if (a.dataset.act === 'delfile') deleteFile(row.dataset.att, row.dataset.url);
  });

  atsGuard('candidates.html', initCandidate);
});
</script>
</body>
</html>
