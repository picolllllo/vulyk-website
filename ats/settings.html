<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ATS · Налаштування · Вулик</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="ats.css">
</head>
<body>

<div id="top"></div>

<div class="wrap">
  <div id="noAccess" class="notice" hidden>
    <h2>Немає доступу</h2>
    <p>Цей акаунт не має ролі <b>hr</b>. Зверніться до адміністратора.</p>
  </div>

  <div id="panel" hidden>
    <div class="panel__head">
      <h2>Позиції</h2>
      <span class="sub">Список для випадайки в загальній формі подачі та для пошуку профілів</span>
    </div>

    <div class="add-row">
      <input id="newPos" type="text" placeholder="Нова позиція, напр. «Логопед»">
      <button id="addBtn" class="btn btn--primary">Додати</button>
    </div>

    <table>
      <thead>
        <tr><th style="width:44px">#</th><th>Назва</th><th style="width:200px;text-align:right">Дії</th></tr>
      </thead>
      <tbody id="posBody"></tbody>
    </table>
    <div id="panelMsg" class="msg"></div>

    <div class="panel__head" style="margin-top:36px">
      <h2>Теги кандидатів</h2>
      <span class="sub">Мітки поза вакансіями (напр. працівник, чорний список). Застосовуються в профілі кандидата.</span>
    </div>

    <div class="add-row">
      <input id="newTag" type="text" placeholder="Новий тег, напр. «Резерв»">
      <input id="newTagColor" type="color" value="#E8A820" title="Колір" style="width:46px;height:38px;padding:3px;border:1px solid var(--line);border-radius:8px;cursor:pointer">
      <button id="addTagBtn" class="btn btn--primary">Додати</button>
    </div>

    <table>
      <thead>
        <tr><th>Тег</th><th style="width:90px">Колір</th><th style="width:120px;text-align:right">Дії</th></tr>
      </thead>
      <tbody id="tagBody"></tbody>
    </table>
    <div id="tagMsg" class="msg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=8"></script>
<script>
let positions = [];

let tags = [];

function initSettings() {
  el('panel').hidden = false;
  loadPositions();
  loadTagsAdmin();
}

async function loadTagsAdmin() {
  const { data, error } = await sb.from('candidate_tags').select('*').order('sort_order').order('name');
  if (error) { flash(el('tagMsg'), 'Помилка завантаження тегів: ' + error.message); return; }
  tags = data || [];
  el('tagBody').innerHTML = tags.map(function (t) {
    return '<tr data-slug="' + escapeHtml(t.slug) + '">'
      + '<td class="name-cell"><input type="text" value="' + escapeHtml(t.name) + '" data-role="tname"></td>'
      + '<td><input type="color" value="' + escapeHtml(t.color) + '" data-role="tcolor" style="width:42px;height:32px;padding:2px;border:1px solid var(--line);border-radius:7px;cursor:pointer"></td>'
      + '<td><div class="actions" style="justify-content:flex-end">'
      +   '<button class="btn btn--danger btn--sm" data-act="deltag">Видалити</button>'
      + '</div></td></tr>';
  }).join('') || '<tr><td colspan="3" class="sub" style="padding:12px">Тегів ще немає.</td></tr>';
}

async function addTag() {
  const name = el('newTag').value.trim(); if (!name) return;
  const slug = 'tag_' + Date.now().toString(36);
  const color = el('newTagColor').value || '#5b6673';
  const maxOrder = tags.reduce(function (m, t) { return Math.max(m, t.sort_order || 0); }, 0);
  const { error } = await sb.from('candidate_tags').insert({ slug: slug, name: name, color: color, sort_order: maxOrder + 10 });
  if (error) { flash(el('tagMsg'), error.message); return; }
  el('newTag').value = ''; flash(el('tagMsg'), 'Додано', true); loadTagsAdmin();
}

async function loadPositions() {
  const { data, error } = await sb.from('positions').select('*').order('sort_order').order('name');
  if (error) { flash(el('panelMsg'), 'Помилка завантаження: ' + error.message); return; }
  positions = data || [];
  render();
}

function render() {
  el('posBody').innerHTML = positions.map(function (p, i) {
    return '<tr data-id="' + p.id + '">'
      + '<td class="ord">' + (i + 1) + '</td>'
      + '<td class="name-cell"><input type="text" value="' + escapeHtml(p.name) + '" data-role="name"></td>'
      + '<td><div class="actions">'
      +   '<button class="btn btn--ghost btn--sm" data-act="up" ' + (i === 0 ? 'disabled' : '') + '>↑</button>'
      +   '<button class="btn btn--ghost btn--sm" data-act="down" ' + (i === positions.length - 1 ? 'disabled' : '') + '>↓</button>'
      +   '<button class="btn btn--danger btn--sm" data-act="delete">Видалити</button>'
      + '</div></td>'
      + '</tr>';
  }).join('');
}

document.addEventListener('DOMContentLoaded', function () {
  el('addBtn').addEventListener('click', addPosition);
  el('newPos').addEventListener('keydown', function (e) { if (e.key === 'Enter') addPosition(); });

  el('posBody').addEventListener('change', async function (e) {
    const inp = e.target.closest('input[data-role="name"]'); if (!inp) return;
    const id = e.target.closest('tr').dataset.id;
    const name = inp.value.trim(); if (!name) { loadPositions(); return; }
    const { error } = await sb.from('positions').update({ name: name }).eq('id', id);
    flash(el('panelMsg'), error ? error.message : 'Збережено', !error);
    if (error) loadPositions();
  });

  el('posBody').addEventListener('click', async function (e) {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const id = btn.closest('tr').dataset.id;
    const idx = positions.findIndex(function (p) { return String(p.id) === id; });
    const p = positions[idx];
    if (btn.dataset.act === 'delete') {
      const { count } = await sb.from('candidates').select('id', { count: 'exact', head: true }).eq('position_id', id);
      const ok = (count && count > 0)
        ? confirm('Видалити позицію «' + p.name + '»?\n\nУ ' + count + ' кандидат(ів) вона зникне з профілю (самі профілі залишаться).')
        : confirm('Видалити позицію «' + p.name + '»?');
      if (!ok) return;
      const { error } = await sb.from('positions').delete().eq('id', id);
      flash(el('panelMsg'), error ? error.message : 'Видалено', !error); loadPositions();
    } else if (btn.dataset.act === 'up' || btn.dataset.act === 'down') {
      const j = btn.dataset.act === 'up' ? idx - 1 : idx + 1;
      if (j < 0 || j >= positions.length) return;
      const a = positions[idx], b = positions[j];
      await sb.from('positions').update({ sort_order: b.sort_order }).eq('id', a.id);
      await sb.from('positions').update({ sort_order: a.sort_order }).eq('id', b.id);
      loadPositions();
    }
  });

  el('addTagBtn').addEventListener('click', addTag);
  el('newTag').addEventListener('keydown', function (e) { if (e.key === 'Enter') addTag(); });

  el('tagBody').addEventListener('change', async function (e) {
    const tr = e.target.closest('tr[data-slug]'); if (!tr) return;
    const slug = tr.dataset.slug;
    const field = e.target.dataset.role === 'tname' ? 'name' : (e.target.dataset.role === 'tcolor' ? 'color' : null);
    if (!field) return;
    const val = e.target.value.trim(); if (field === 'name' && !val) { loadTagsAdmin(); return; }
    const { error } = await sb.from('candidate_tags').update({ [field]: val }).eq('slug', slug);
    flash(el('tagMsg'), error ? error.message : 'Збережено', !error);
    if (error) loadTagsAdmin();
  });

  el('tagBody').addEventListener('click', async function (e) {
    const btn = e.target.closest('button[data-act="deltag"]'); if (!btn) return;
    const tr = btn.closest('tr[data-slug]'); const slug = tr.dataset.slug;
    const t = tags.find(function (x) { return x.slug === slug; });
    const { count } = await sb.from('candidates').select('id', { count: 'exact', head: true }).eq('tag', slug);
    const ok = (count && count > 0)
      ? confirm('Видалити тег «' + (t ? t.name : slug) + '»?\n\nУ ' + count + ' кандидат(ів) він зникне (профілі залишаться).')
      : confirm('Видалити тег «' + (t ? t.name : slug) + '»?');
    if (!ok) return;
    if (count && count > 0) await sb.from('candidates').update({ tag: null }).eq('tag', slug);
    const { error } = await sb.from('candidate_tags').delete().eq('slug', slug);
    flash(el('tagMsg'), error ? error.message : 'Видалено', !error); loadTagsAdmin();
  });

  atsGuard('settings.html', initSettings);
});

async function addPosition() {
  const name = el('newPos').value.trim(); if (!name) return;
  const maxOrder = positions.reduce(function (m, p) { return Math.max(m, p.sort_order || 0); }, 0);
  const { error } = await sb.from('positions').insert({ name: name, sort_order: maxOrder + 10 });
  if (error) { flash(el('panelMsg'), error.message.indexOf('duplicate') > -1 ? 'Така позиція вже є' : error.message); return; }
  el('newPos').value = ''; flash(el('panelMsg'), 'Додано', true); loadPositions();
}
</script>
</body>
</html>
